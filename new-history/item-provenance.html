<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PoD Item Provenance</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #222;
      --panel: #000;
      --ink: #f1ead8;
      --muted: #b9b19f;
      --gold: #bbb;
      --line: #444;
    }

    * { box-sizing: border-box; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    main { margin: 0 auto; max-width: 900px; padding: 48px 20px; }
    h1 { color: var(--gold); font-size: 1.4rem; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 28px; }
    form { display: flex; gap: 10px; }
    input {
      background: #181818;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
      font: inherit;
      min-width: 0;
      padding: 11px 12px;
      flex: 1;
    }
    button {
      background: var(--line);
      border: 0;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: bold;
      padding: 11px 18px;
    }
    #status { display: block; color: var(--muted); margin: 20px 0; }
    #result { display: none; }
    h2 { font-size: 1.25rem; margin: 0 0 12px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: left; }
    th { color: var(--gold); font-size: .82rem; text-transform: uppercase; }
    @media (max-width: 520px) {
      main { padding-top: 30px; }
      form { display: grid; }
      button { width: 100%; }
      th, td { font-size: .9rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Item Provenance</h1>
    <p>Item sightings across saved character snapshots.</p>
    <form id="lookup-form">
      <input id="item-id" type="search" inputmode="numeric" placeholder="Enter item ID" autocomplete="off" required>
      <button type="submit">Look up</button>
    </form>
    <output id="status">Loading item index...</output>
    <section id="result" aria-live="polite">
      <h2 id="item-title"></h2>
      <table>
        <thead><tr><th>Timestamp</th><th>Character</th><th>Equipped</th></tr></thead>
        <tbody id="observations"></tbody>
      </table>
    </section>
  </main>
  <script>
    const form = document.getElementById("lookup-form");
    const input = document.getElementById("item-id");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const title = document.getElementById("item-title");
    const observations = document.getElementById("observations");
    let provenanceIndex = null;

    function formatDate(timestamp) {
      const [year, month, day] = timestamp.slice(0, 10).split("-");
      return `${month}-${day}-${year}`;
    }

    function renderItem(itemId) {
      const item = provenanceIndex[itemId];
      observations.replaceChildren();
      result.style.display = "none";

      if (!item) {
        status.textContent = `No equipped-item sightings found for ID ${itemId}.`;
        return;
      }

      title.textContent = `${item.title || "Unknown item"} (Item ID: ${itemId})`;
      for (const observation of item.observations) {
        const row = document.createElement("tr");
        for (const value of [formatDate(observation.timestamp), observation.character, observation.equipped || "Unknown slot"]) {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.append(cell);
        }
        observations.append(row);
      }
      status.textContent = `${item.observations.length} equipped sightings.`;
      result.style.display = "block";
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const itemId = input.value.trim();
      if (!itemId || !provenanceIndex) return;
      history.replaceState(null, "", `?id=${encodeURIComponent(itemId)}`);
      renderItem(itemId);
    });

    fetch("item_provenance.json")
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((index) => {
        provenanceIndex = index;
        status.textContent = "Enter an item ID to view its provenance.";
        const itemId = new URLSearchParams(window.location.search).get("id");
        if (itemId) {
          input.value = itemId;
          renderItem(itemId);
        }
      })
      .catch((error) => {
        status.textContent = `Could not load item_provenance.json: ${error.message}`;
      });
  </script>
</body>
</html>
