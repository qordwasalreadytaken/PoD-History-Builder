name: Daily Ladder Fetch

on:
  schedule:
    - cron: '35 11 * * *'  # Runs at 11:35 AM UTC every day
  workflow_dispatch:

jobs:
  fetch-ladder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetch_ladder_data.py
        run: python new-history/fetch_ladder_data.py

      - name: Generate synth inventory
        run: python synth-inventory.py
  
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Automated daily ladder fetch'
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
