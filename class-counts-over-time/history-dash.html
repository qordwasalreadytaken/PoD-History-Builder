<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PoD Class Counts Over Time</title>

<script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

<style>
body {
    margin: 0;
    font-family: sans-serif;
    background: #111;
    color: #ddd;
}

.layout {
    display: flex;
    height: 100vh;
}

.controls {
    display: block;
}

select, input {
    padding: 6px;
}

.chart {
    width: 100%;
    height: 600px;
}

#tableContainer {
    margin-top: 20px;
    overflow-x: auto;
}

#tableContainer table {
    border-collapse: collapse;
    width: 100%;
    background: #1a1a1a;
}

#tableContainer th,
#tableContainer td {
    border: 1px solid #333;
    padding: 8px;
    text-align: center;
}

#tableContainer th {
    background: #222;
    color: #ddd;
}

#tableContainer tr:nth-child(even) {
    background: #181818;
}

#tableContainer tr:hover {
    background: #2a2a2a;
}

/* LEFT SIDEBAR */
.main {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    box-sizing: border-box;
}

.sidebar {
    box-sizing: border-box;
}

/* controls styling */
.sidebar label {
    display: block;
    margin-top: 12px;
    margin-bottom: 4px;
    color: #aaa;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.sidebar select,
.sidebar input {
    width: 100%;
    padding: 6px;
    background: #222;
    color: #ddd;
    border: 1px solid #333;
    border-radius: 4px;
}

/* info section */
#seasonInfo {
    margin-top: 15px;
    font-size: 13px;
    line-height: 1.4;
}

#seasonInfo table {
    width: 100%;
}

#seasonInfo td {
    padding: 2px 0;
}

#seasonInfo td:first-child {
    color: #888;
}

h1 {
    margin-top: 0;
    margin-bottom: 15px;
}

.insight {
    background: #1e1e1e;
    border-left: 3px solid #555;
    padding: 6px 8px;
    margin-bottom: 6px;
    font-size: 13px;
    color: #ddd;
}

</style>
</head>

<body>
<div class="layout">
<div class="sidebar">
<div class="controls">
    <label>Mode:</label>
    <select id="mode">
        <option value="sc">Softcore</option>
        <option value="hc">Hardcore</option>
    </select>

    <label>Level:</label>
    <select id="level">
        <option value="80">80+</option>
        <option value="90">90+</option>
        <option value="95" selected>95+</option>
        <option value="96">96+</option>
        <option value="97">97+</option>
        <option value="98">98+</option>
        <option value="99">99+</option>
    </select>

    <label>Top:</label>

    <select id="cutoff">
        <option value="1000" selected>Top 1000</option>
        <option value="500">Top 500</option>
        <option value="250">Top 250</option>
        <option value="100">Top 100</option>
    </select>
<label>Season:</label>
<input id="season" type="range" min="1" max="13" value="13">

<span id="seasonLabel">13</span>
<div id="seasonInfo" class="season-info"></div>

</div>
</div>
<div class="main">
<h1>PoD Class Counts from the Top 1K Over Time</h1>
<br>
<div id="lines" class="chart"></div>
<br>
<div id="trends" class="chart"></div>
<br>
<h1>Raw counts of the top <span id="cutoffDisplay">1000</span> at Levels <span id="levelDisplay">95+</span></h1>
<div id="tableContainer"></div>
<br>
<div id="insights"></div>

</div>
<script>
let DATA = null;
let timer = null;

const CLASSES = ["ama","asn","bar","dru","nec","pal","sor"];

const CLASS_COLORS = {
    "Amazon": "rgb(255, 102, 105)",
    "Assassin": "rgb(255, 255, 255)",
    "Barbarian": "rgb(150, 105, 32)",
    "Druid": "rgb(255, 186, 74)",
    "Necromancer": "rgb(179, 255, 253)",
    "Paladin": "rgb(255, 243, 112)",
    "Sorceress": "rgb(188, 107, 255)"
};

const INSIGHT_TYPES = {
    DOMINANCE: "dominance",
    SHIFT: "shift",
    ELITE: "elite",
    STABILITY: "stability",
    DIVERSITY: "diversity",
    TIME: "temporal",
    OUTLIER: "outlier"
};

async function load() {
    const res = await fetch("meta_analysis.json");
    DATA = await res.json();

    document.getElementById("season").value = season;
    document.getElementById("seasonLabel").textContent = season;

    renderAll();
}

function seasons() {
    return Object.keys(DATA.sc).map(Number).sort((a,b)=>a-b);
}

function get(mode, season, cutoff, level) {
    return DATA?.[mode]?.[season]?.[cutoff]?.[level] || {
        counts: {},
        total: 0
    };
}

function renderSeason(season) {
    const mode = document.getElementById("mode").value;
    const level = document.getElementById("level").value;
    const cutoff = document.getElementById("cutoff").value;

    const d = get(mode, season, cutoff, level);

    const x = [];
    const y = [];
    const colors = [];

    for (const cls of CLASSES) {
        const name = DATA.classes[cls];

        x.push(name);
        y.push(d.counts?.[cls] || 0);
        colors.push(CLASS_COLORS[name]);
    }

    Plotly.react("lines", [{
        type: "bar",
        x,
        y,
        marker: {
            color: colors,
            line: {
                color: "#444",
                width: 1
            }
        }
    }], {
        title: `Season ${season} (${mode.toUpperCase()} Top ${cutoff} • ${level}+)`,

        paper_bgcolor: "#1a1a1a",
        plot_bgcolor: "#222222",

        hoverlabel: {
            bgcolor: "#2a2a2a",
            bordercolor: "#555",
            font: { color: "#dddddd" }
        },

        font: {
            color: "#dddddd",
            size: 14
        },

        xaxis: {
            color: "#dddddd",
            gridcolor: "#333333"
        },

        yaxis: {
            title: "Characters",
            color: "#dddddd",
            gridcolor: "#333333"
        },

        margin: {
            t: 60,
            l: 60,
            r: 30,
            b: 60
        }
    }, {
        responsive: true,
        displaylogo: false
    });
}

function renderAll() {
    const mode = document.getElementById("mode").value;
    const cutoff = document.getElementById("cutoff").value;
    const level = document.getElementById("level").value;

    const prevSeason = season - 1;

    renderSeason(season);
    renderTable();
    renderSeasonInfo();
    renderTrendChart();

    const insights = generateInsights(
        DATA,
        mode,
        season,
        cutoff,
        level,
        prevSeason
    );

    renderInsights(insights);

    document.getElementById("levelDisplay").textContent = level + "+";
}

function renderTable() {
    const mode = document.getElementById("mode").value;
    const level = document.getElementById("level").value;
    const cutoff = document.getElementById("cutoff").value;

    let html = "<table>";

    html += "<tr>";
    html += "<th>Season</th>";

    for (const cls of CLASSES) {
        html += `<th>${DATA.classes[cls]}</th>`;
    }

    html += "<th>Total</th>";
    html += "</tr>";

    const seasons = Object.keys(DATA[mode])
        .map(Number)
        .sort((a, b) => a - b);

    for (const s of seasons) {
        const d = get(mode, s, cutoff, level);

        html += "<tr>";
        html += `<td>${s}</td>`;

        for (const cls of CLASSES) {
            html += `<td>${d.counts?.[cls] || 0}</td>`;
        }

        html += `<td><strong>${d.total}</strong></td>`;
        html += "</tr>";
    }

    html += "</table>";

    document.getElementById("tableContainer").innerHTML = html;
}

function renderTrendChart() {
    const mode = document.getElementById("mode").value;
    const level = document.getElementById("level").value;
    const cutoff = document.getElementById("cutoff").value;

    const seasons = Object.keys(DATA[mode])
        .map(Number)
        .sort((a, b) => a - b);

    const traces = [];

    for (const cls of CLASSES) {
        const label = DATA.classes[cls];

        traces.push({
            x: seasons,
            y: seasons.map(s =>
                get(mode, s, cutoff, level).counts?.[cls] || 0
            ),
            mode: "lines+markers",
            name: label,
            line: {
                color: CLASS_COLORS[label],
                width: 3
            },
            marker: {
                color: CLASS_COLORS[label],
                size: 8,
                line: {
                    color: "#333",
                    width: 1
                }
            }
        });
    }

    Plotly.react("trends", traces, {
        title: `${mode.toUpperCase()} Class Trends (Top ${cutoff}, ${level}+)`,

        paper_bgcolor: "#1a1a1a",
        plot_bgcolor: "#222222",

        font: {
            color: "#dddddd"
        },

        xaxis: {
            title: "Season",
            tickmode: "array",
            tickvals: seasons,
            gridcolor: "#333"
        },

        yaxis: {
            title: "Characters",
            gridcolor: "#333"
        },

        legend: {
            bgcolor: "#222"
        },

        hoverlabel: {
            bgcolor: "#2a2a2a",
            font: {
                color: "#ddd"
            }
        }
    }, {
        responsive: true,
        displaylogo: false
    });
}

function renderSeasonInfo() {
    const mode = document.getElementById("mode").value;
    const level = document.getElementById("level").value;
    const cutoff = document.getElementById("cutoff").value;

    const seasonData = DATA?.[mode]?.[season];
    const d = get(mode, season, cutoff, level);

    if (!seasonData) {
        document.getElementById("seasonInfo").innerHTML =
            "<p>No data available.</p>";
        return;
    }

    let html = `
        <h2>Season ${season}</h2>

        <table>
            <tr>
                <td>Approx. Length</td>
                <td>${seasonData.season_length ?? "Unknown"} months</td>
            </tr>

            <tr>
                <td>Mode</td>
                <td>${mode === "sc" ? "Softcore" : "Hardcore"}</td>
            </tr>

            <tr>
                <td>Top Ladder Slice</td>
                <td>Top ${cutoff}</td>
            </tr>

            <tr>
                <td>Level Filter</td>
                <td>${level}+</td>
            </tr>

            <tr>
                <td>Characters Matching</td>
                <td>${d.total}</td>
            </tr>

            <tr>
                <td>Median Level</td>
                <td>${d.median_level}</td>
            </tr>

            <tr>
                <td>Average Level</td>
                <td>${d.average_level}</td>
            </tr>
    `;

    if (d.account_coverage >= 75) {
        html += `
            <tr>
                <td>Unique Accounts</td>
                <td>${d.unique_accounts}</td>
            </tr>

            <tr>
                <td>Account Coverage</td>
                <td>${d.account_coverage}%</td>
            </tr>
        `;
    }

    html += "</table>";

    document.getElementById("seasonInfo").innerHTML = html;
}

function formatElitePhrase(name, delta) {
    if (delta > 0) {
        return `${name} appears more frequently in Top 100 than expected from its overall ladder presence`;
    } else {
        return `${name} appears less frequently in Top 100 than expected from its overall ladder presence`;
    }
}

function generateInsights(data, mode, season, cutoff, level, prevSeason) {
    const d = data[mode][season]?.[cutoff]?.[level];
    const prev = data[mode][prevSeason]?.[cutoff]?.[level];

    if (!d) return [];

    const insights = [];

    // -----------------------------
    // 1. Dominant class
    // -----------------------------
    const sorted = Object.entries(d.counts)
        .sort((a, b) => b[1] - a[1]);

    if (sorted.length > 0) {
        const [topClass, topCount] = sorted[0];
        const total = d.total || 1;
        const pct = (topCount / total) * 100;

        insights.push({
            text: `${DATA.classes[topClass]} is the most played class (${pct.toFixed(1)}% of Top ${cutoff}, Level ${level}+)`,
            type: "dominance",
            score: 4
        });
    }

    // -----------------------------
    // 2. Meta concentration
    // -----------------------------
    if (d.dominance != null) {
        let label = "balanced";

        if (d.dominance > 0.25) label = "highly concentrated";
        else if (d.dominance > 0.18) label = "moderately concentrated";

        insights.push({
            text: `The meta is ${label} in this snapshot`,
            type: "dominance",
            score: 3
        });
    }

    // -----------------------------
    // 3. Biggest shift vs last season
    // -----------------------------
    if (prev?.counts) {
        let biggestChange = null;

        for (const cls of Object.keys(d.counts)) {
            const curr = d.counts[cls] || 0;
            const last = prev.counts[cls] || 0;

            const diff = curr - last;

            if (!biggestChange || Math.abs(diff) > Math.abs(biggestChange.diff)) {
                biggestChange = { cls, diff };
            }
        }

        if (biggestChange) {
            const name = DATA.classes[biggestChange.cls];
            const arrow = biggestChange.diff > 0 ? "↑" : "↓";

            insights.push({
                text: `${name} changed the most from last season (${arrow}${Math.abs(biggestChange.diff)})`,
                type: "shift",
                score: 5
            });
        }
    }

    // -----------------------------
    // 4. Elite vs general divergence
    // -----------------------------
    const top100 = data[mode][season]?.["100"]?.[level];
    const top1000 = data[mode][season]?.["1000"]?.[level];

    if (!top100 || !top1000) return insights;

    const divergences = [];

    // compute per-class deltas
    for (const cls of Object.keys(top1000.counts)) {
        const elite = top100.counts?.[cls] || 0;
        const general = top1000.counts?.[cls] || 0;

        divergences.push({
            cls,
            delta: elite - general
        });
    }

    // sort for gains (elite overrepresented)
    const gainers = [...divergences]
        .sort((a, b) => b.delta - a.delta)
        .slice(0, 2);

    // sort for losers (elite underrepresented)
    const losers = [...divergences]
        .sort((a, b) => a.delta - b.delta)
        .slice(0, 2);

    // -----------------------------
    // Insight: elite gainers
    // -----------------------------
    if (gainers.length) {
        const g0 = gainers[0];
        insights.push({
            text: formatElitePhrase(DATA.classes[g0.cls], g0.delta),
            type: "elite",
            score: 5
        });    }

    // -----------------------------
    // Insight: elite losers
    // -----------------------------
    if (losers.length) {
        const l0 = losers[0];
        insights.push({
            text: formatElitePhrase(DATA.classes[l0.cls], l0.delta),
            type: "elite",
            score: 5
        });
    }

    // -----------------------------
    // Optional: second gainer/loser for extra depth
    // -----------------------------
    if (gainers[1]) {
        const name = DATA.classes[gainers[1].cls];
        const delta = gainers[1].delta;

        const g1 = gainers[1];

        insights.push({
            text: formatElitePhrase(DATA.classes[g1.cls], g1.delta),
            type: "elite",
            score: 4
        });
    }

    if (losers[1]) {
        const l1 = losers[1];

        insights.push({
            text: formatElitePhrase(DATA.classes[l1.cls], l1.delta),
            type: "elite",
            score: 4
        });
    }

    // -----------------------------
    // 5. Population / activity level
    // -----------------------------
    const active = d.total;

    if (active < 200) {
        insights.push({
            text: "Low number of high-level characters in this snapshot (tight elite pool)",
            type: "population",
            score: 3
        });
    } else if (active > 600) {
        insights.push({
            text: "Large high-level population compared to other seasons",
            type: "population",
            score: 3
        });
    }

    // -----------------------------
    // FINAL: sort by importance
    // -----------------------------
    return insights.sort((a, b) => b.score - a.score);
}

function renderInsights(insights) {
    if (!insights || insights.length === 0) {
        document.getElementById("insights").innerHTML =
            `<h3>Key Insights</h3><div class="insight">No insights available</div>`;
        return;
    }

    const top = insights.slice(0, 11);

    document.getElementById("insights").innerHTML =
        `<h3>Key Insights</h3>` +
        top.map(i => {
            const icon =
                i.type === "dominance" ? "📊" :
                i.type === "shift" ? "🔄" :
                i.type === "elite" ? "⚔️" :
                i.type === "population" ? "👥" :
                "•";

            return `<div class="insight">${icon} ${i.text}</div>`;
        }).join("");
}

function scoreInsight(type, magnitude = 1) {
    const base = {
        dominance: 3,
        shift: 5,
        elite: 5,
        stability: 4,
        diversity: 3,
        temporal: 4,
        outlier: 5
    };

    return base[type] * magnitude;
}


let season = 13;

document.getElementById("season").addEventListener("input", (e) => {
    season = Number(e.target.value);
    document.getElementById("seasonLabel").textContent = season;
    renderAll();
});

document.getElementById("mode").addEventListener("change", renderAll);

document.getElementById("level").addEventListener("change", renderAll);

document.getElementById("cutoff").addEventListener("change", renderAll);

load();

</script>
</div>
</body>
</html>
