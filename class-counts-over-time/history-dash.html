<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PoD Class Counts Over Time</title>

<script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

<style>
body {
    margin: 0;
    font-family: sans-serif;
    background: #111;
    color: #ddd;
}

.layout {
    display: flex;
    height: 100vh;
}

.controls {
    display: block;
}

select, input {
    padding: 6px;
}

.chart {
    width: 100%;
    height: 600px;
}

#tableContainer {
    margin-top: 20px;
    overflow-x: auto;
}

#tableContainer table {
    border-collapse: collapse;
    width: 100%;
    background: #1a1a1a;
}

#tableContainer th,
#tableContainer td {
    border: 1px solid #333;
    padding: 8px;
    text-align: center;
}

#tableContainer th {
    background: #222;
    color: #ddd;
}

#tableContainer tr:nth-child(even) {
    background: #181818;
}

#tableContainer tr:hover {
    background: #2a2a2a;
}

/* LEFT SIDEBAR */
.main {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    box-sizing: border-box;
}

.sidebar {
    box-sizing: border-box;
}

/* controls styling */
.sidebar label {
    display: block;
    margin-top: 12px;
    margin-bottom: 4px;
    color: #aaa;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.sidebar select,
.sidebar input {
    width: 100%;
    padding: 6px;
    background: #222;
    color: #ddd;
    border: 1px solid #333;
    border-radius: 4px;
}

/* info section */
#seasonInfo {
    margin-top: 15px;
    font-size: 13px;
    line-height: 1.4;
}

#seasonInfo table {
    width: 100%;
}

#seasonInfo td {
    padding: 2px 0;
}

#seasonInfo td:first-child {
    color: #888;
}

h1 {
    margin-top: 0;
    margin-bottom: 15px;
}

</style>
</head>

<body>
<div class="layout">
<div class="sidebar">
<div class="controls">
    <label>Mode:</label>
    <select id="mode">
        <option value="sc">Softcore</option>
        <option value="hc">Hardcore</option>
    </select>

    <label>Level:</label>
    <select id="level">
        <option value="80">80+</option>
        <option value="90">90+</option>
        <option value="95" selected>95+</option>
        <option value="96">96+</option>
        <option value="97">97+</option>
        <option value="98">98+</option>
        <option value="99">99+</option>
    </select>

    <label>Top:</label>

    <select id="cutoff">
        <option value="1000" selected>Top 1000</option>
        <option value="500">Top 500</option>
        <option value="250">Top 250</option>
        <option value="100">Top 100</option>
    </select>
<label>Season:</label>
<input id="season" type="range" min="1" max="13" value="13">

<span id="seasonLabel">13</span>
<div id="seasonInfo" class="season-info"></div>

</div>
</div>
<div class="main">
<h1>PoD Class Counts from the Top 1K Over Time</h1>
<br>
<div id="lines" class="chart"></div>
<br>
<div id="trends" class="chart"></div>
<br>
<h1>Raw counts of the top <span id="cutoffDisplay">1000</span> at Levels <span id="levelDisplay">95+</span></h1>
<div id="tableContainer"></div>
<br>
</div>
<script>
let DATA = null;
let timer = null;

const CLASSES = ["ama","asn","bar","dru","nec","pal","sor"];

const CLASS_COLORS = {
    "Amazon": "rgb(255, 102, 105)",
    "Assassin": "rgb(255, 255, 255)",
    "Barbarian": "rgb(150, 105, 32)",
    "Druid": "rgb(255, 186, 74)",
    "Necromancer": "rgb(179, 255, 253)",
    "Paladin": "rgb(255, 243, 112)",
    "Sorceress": "rgb(188, 107, 255)"
};

async function load() {
    const res = await fetch("meta_analysis.json");
    DATA = await res.json();

    document.getElementById("season").value = season;
    document.getElementById("seasonLabel").textContent = season;

    renderAll();
}

function seasons() {
    return Object.keys(DATA.sc).map(Number).sort((a,b)=>a-b);
}

function get(mode, season, cutoff, level) {
    return DATA?.[mode]?.[season]?.[cutoff]?.[level] || {
        counts: {},
        total: 0
    };
}

function renderSeason(season) {
    const mode = document.getElementById("mode").value;
    const level = document.getElementById("level").value;
    const cutoff = document.getElementById("cutoff").value;

    const d = get(mode, season, cutoff, level);

    const x = [];
    const y = [];
    const colors = [];

    for (const cls of CLASSES) {
        const name = DATA.classes[cls];

        x.push(name);
        y.push(d.counts?.[cls] || 0);
        colors.push(CLASS_COLORS[name]);
    }

    Plotly.react("lines", [{
        type: "bar",
        x,
        y,
        marker: {
            color: colors,
            line: {
                color: "#444",
                width: 1
            }
        }
    }], {
        title: `Season ${season} (${mode.toUpperCase()} Top ${cutoff} • ${level}+)`,

        paper_bgcolor: "#1a1a1a",
        plot_bgcolor: "#222222",

        hoverlabel: {
            bgcolor: "#2a2a2a",
            bordercolor: "#555",
            font: { color: "#dddddd" }
        },

        font: {
            color: "#dddddd",
            size: 14
        },

        xaxis: {
            color: "#dddddd",
            gridcolor: "#333333"
        },

        yaxis: {
            title: "Characters",
            color: "#dddddd",
            gridcolor: "#333333"
        },

        margin: {
            t: 60,
            l: 60,
            r: 30,
            b: 60
        }
    }, {
        responsive: true,
        displaylogo: false
    });
}

function renderAll() {
    renderSeason(season);
    renderSeasonInfo();
    renderTrendChart();
    renderTable();

    document.getElementById("levelDisplay").textContent =
        document.getElementById("level").value + "+";
    document.getElementById("cutoffDisplay").textContent =
        document.getElementById("cutoff").value;
}

function renderTable() {
    const mode = document.getElementById("mode").value;
    const level = document.getElementById("level").value;
    const cutoff = document.getElementById("cutoff").value;

    let html = "<table>";

    html += "<tr>";
    html += "<th>Season</th>";

    for (const cls of CLASSES) {
        html += `<th>${DATA.classes[cls]}</th>`;
    }

    html += "<th>Total</th>";
    html += "</tr>";

    const seasons = Object.keys(DATA[mode])
        .map(Number)
        .sort((a, b) => a - b);

    for (const s of seasons) {
        const d = get(mode, s, cutoff, level);

        html += "<tr>";
        html += `<td>${s}</td>`;

        for (const cls of CLASSES) {
            html += `<td>${d.counts?.[cls] || 0}</td>`;
        }

        html += `<td><strong>${d.total}</strong></td>`;
        html += "</tr>";
    }

    html += "</table>";

    document.getElementById("tableContainer").innerHTML = html;
}

function renderTrendChart() {
    const mode = document.getElementById("mode").value;
    const level = document.getElementById("level").value;
    const cutoff = document.getElementById("cutoff").value;

    const seasons = Object.keys(DATA[mode])
        .map(Number)
        .sort((a, b) => a - b);

    const traces = [];

    for (const cls of CLASSES) {
        const label = DATA.classes[cls];

        traces.push({
            x: seasons,
            y: seasons.map(s =>
                get(mode, s, cutoff, level).counts?.[cls] || 0
            ),
            mode: "lines+markers",
            name: label,
            line: {
                color: CLASS_COLORS[label],
                width: 3
            },
            marker: {
                color: CLASS_COLORS[label],
                size: 8,
                line: {
                    color: "#333",
                    width: 1
                }
            }
        });
    }

    Plotly.react("trends", traces, {
        title: `${mode.toUpperCase()} Class Trends (Top ${cutoff}, ${level}+)`,

        paper_bgcolor: "#1a1a1a",
        plot_bgcolor: "#222222",

        font: {
            color: "#dddddd"
        },

        xaxis: {
            title: "Season",
            tickmode: "array",
            tickvals: seasons,
            gridcolor: "#333"
        },

        yaxis: {
            title: "Characters",
            gridcolor: "#333"
        },

        legend: {
            bgcolor: "#222"
        },

        hoverlabel: {
            bgcolor: "#2a2a2a",
            font: {
                color: "#ddd"
            }
        }
    }, {
        responsive: true,
        displaylogo: false
    });
}

function renderSeasonInfo() {
    const mode = document.getElementById("mode").value;
    const level = document.getElementById("level").value;
    const cutoff = document.getElementById("cutoff").value;

    const seasonData = DATA?.[mode]?.[season];
    const d = get(mode, season, cutoff, level);

    if (!seasonData) {
        document.getElementById("seasonInfo").innerHTML =
            "<p>No data available.</p>";
        return;
    }

    let html = `
        <h2>Season ${season}</h2>

        <table>
            <tr>
                <td>Approx. Length</td>
                <td>${seasonData.season_length ?? "Unknown"} months</td>
            </tr>

            <tr>
                <td>Mode</td>
                <td>${mode === "sc" ? "Softcore" : "Hardcore"}</td>
            </tr>

            <tr>
                <td>Top Ladder Slice</td>
                <td>Top ${cutoff}</td>
            </tr>

            <tr>
                <td>Level Filter</td>
                <td>${level}+</td>
            </tr>

            <tr>
                <td>Characters Matching</td>
                <td>${d.total}</td>
            </tr>

            <tr>
                <td>Median Level</td>
                <td>${d.median_level}</td>
            </tr>

            <tr>
                <td>Average Level</td>
                <td>${d.average_level}</td>
            </tr>
    `;

    if (d.account_coverage >= 75) {
        html += `
            <tr>
                <td>Unique Accounts</td>
                <td>${d.unique_accounts}</td>
            </tr>

            <tr>
                <td>Account Coverage</td>
                <td>${d.account_coverage}%</td>
            </tr>
        `;
    }

    html += "</table>";

    document.getElementById("seasonInfo").innerHTML = html;
}

let season = 13;

document.getElementById("season").addEventListener("input", (e) => {
    season = Number(e.target.value);
    document.getElementById("seasonLabel").textContent = season;
    renderAll();
});

document.getElementById("mode").addEventListener("change", renderAll);

document.getElementById("level").addEventListener("change", renderAll);

document.getElementById("cutoff").addEventListener("change", renderAll);

load();

</script>
</div>
</body>
</html>
